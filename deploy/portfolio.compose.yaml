# ──────────────────────────────────────────────────────────────────────
# portfolio web — debian docker host
# ──────────────────────────────────────────────────────────────────────
# vive en el host docker (debian) en: /srv/stacks/portfolio/compose.yml
#
# arquitectura:
#   - imagen ghcr.io/donutinit/portfolio:latest se buildea y sube sola en
#     cada push a main vía .github/workflows/build.yml
#   - watchtower vigila SOLO este contenedor (por label) y al detectar un
#     nuevo :latest lo jala y lo recrea. asi cada push llega al host solo.
#   - media servida desde dataset zfs local: zroot/srv/portfolio/media
#     (mudado de truenas triceratops/portfolio con zfs send/recv)
#
# acceso / red:
#   - portfolio bindeado a 127.0.0.1:30303 → SOLO loopback del host, NO lan.
#   - cloudflared corre aqui con network_mode: host, asi su "localhost" es
#     el del host y alcanza 127.0.0.1:30303 sin exponer nada en la red.
#   - el token del tunnel va en un .env (TUNNEL_TOKEN), NO se commitea.
#
# ingress en el dashboard del tunnel:
#     www.vondiego.com -> http://localhost:30303
#
# nota watchtower:
#   containrrr/watchtower esta sin mantenimiento y su cliente docker viejo
#   choca con daemons docker nuevos (>= 25). por eso DOCKER_API_VERSION.
#   si un upgrade futuro de docker lo rompe: fork mantenido o pasar a un
#   timer systemd con `docker compose pull && up -d`.
# ──────────────────────────────────────────────────────────────────────

services:
  portfolio:
    image: ghcr.io/donutinit/portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    pull_policy: always

    ports:
      - "127.0.0.1:30303:80"          # solo host, NO lan

    volumes:
      - /srv/portfolio/media:/usr/share/nginx/html/media:ro

    labels:
      com.centurylinklabs.watchtower.enable: "true"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: portfolio-watchtower
    restart: unless-stopped

    environment:
      - DOCKER_API_VERSION=1.40

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    # --label-enable: SOLO vigila contenedores con la label de arriba.
    #   otros stacks del host (p.ej. vitransfer) NO la tienen → no los toca.
    # --cleanup: borra imagenes viejas tras actualizar (cuida disco/SD).
    command: --label-enable --cleanup --interval 30

  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    container_name: portfolio-cloudflared
    restart: unless-stopped
    network_mode: host                 # su localhost = el del host
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}    # se lee de .env (no commitear)

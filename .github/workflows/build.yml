name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        # anclado a SHA: un tag es móvil y este job trae CLOUDFLARE_API_TOKEN
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # supply-chain: nada de postinstall scripts. solo se rebuildean
      # los binarios nativos conocidos. mismo criterio que tenia el Dockerfile.
      - name: install deps
        run: |
          npm ci --ignore-scripts
          npm rebuild sharp esbuild

      - name: check
        run: npm run check

      # cada <picture> pide AVIF y respaldo a R2: si falta uno, la foto sale
      # rota. medidas.json dice qué debe existir; esto lo comprueba antes de
      # desplegar nada.
      - name: revisar derivados
        run: npm run revisar-derivados

      - name: build
        run: npm run build

      # von: el mismo archivo con piel de gitweb. sale a dist-von/
      - name: build von
        run: npm run build:von

      # dev: el mismo archivo vendido como software. sale a dist-dev/
      - name: build dev
        run: npm run build:dev

      # tube: el mismo archivo con piel de sitio de videos. sale a dist-tube/
      - name: build tube
        run: npm run build:tube

      # ig: el mismo archivo con piel de red social de fotos. sale a dist-ig/
      - name: build ig
        run: npm run build:ig

      # despliega dist/ a Workers Static Assets.
      # requiere el secret CLOUDFLARE_API_TOKEN con permisos:
      #   Workers Scripts:Edit + Account Settings:Read
      # OJO: ese token NO puede tener filtro de IP, los runners de github
      # salen por IPs de azure. usar uno distinto al de uso local.
      - name: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'

      # despliega dist-von/ al worker `museo-von` (von.vondiego.com).
      # va después del sitio principal: si von falla, www ya salió.
      - name: deploy von
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: deploy --config wrangler.von.jsonc

      # despliega dist-dev/ al worker `museo-dev` (dev.vondiego.com).
      - name: deploy dev
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: deploy --config wrangler.dev.jsonc

      # despliega dist-tube/ al worker `museo-tube` (tube.vondiego.com).
      - name: deploy tube
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: deploy --config wrangler.tube.jsonc

      # despliega dist-ig/ al worker `museo-ig` (ig.vondiego.com).
      - name: deploy ig
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: deploy --config wrangler.ig.jsonc

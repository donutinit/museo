name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        # anclado a SHA: un tag es móvil y este job trae CLOUDFLARE_API_TOKEN
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # supply-chain: nada de postinstall scripts. solo se rebuildean
      # los binarios nativos conocidos. mismo criterio que tenia el Dockerfile.
      - name: install deps
        run: |
          npm ci --ignore-scripts
          npm rebuild sharp esbuild

      - name: check
        run: npm run check

      - name: build
        run: npm run build

      # despliega dist/ a Workers Static Assets.
      # requiere el secret CLOUDFLARE_API_TOKEN con permisos:
      #   Workers Scripts:Edit + Account Settings:Read
      # OJO: ese token NO puede tener filtro de IP, los runners de github
      # salen por IPs de azure. usar uno distinto al de uso local.
      - name: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
